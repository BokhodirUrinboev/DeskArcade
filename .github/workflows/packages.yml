# Publishes a GitHub release to the package managers: the Homebrew tap, the Scoop bucket, winget, Chocolatey
# and the AUR.
#
# release.yml runs this after it publishes a release. Run it by hand (Actions → Package managers → Run
# workflow) to publish an existing release again, for example after a failed push or a renewed token.
# docs/RELEASING.md covers the tokens and keys it needs. A job whose secret is missing skips with a warning.
name: Package managers

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      PACKAGING_TOKEN:
        required: false
      WINGET_TOKEN:
        required: false
      CHOCOLATEY_API_KEY:
        required: false
      AUR_SSH_KEY:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to publish (for example 1.8.2). Its GitHub release must exist.'
        required: true

permissions:
  contents: read

env:
  # Passed through the environment, never pasted into a script, so input can't inject shell code.
  VERSION: ${{ inputs.version }}

jobs:
  homebrew-scoop:
    name: Homebrew tap and Scoop bucket
    runs-on: ubuntu-24.04
    steps:
      # PACKAGING_TOKEN: a fine-grained token with Contents read and write on the tap and the bucket only.
      - name: Check for the token
        id: token
        env:
          PACKAGING_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
        run: |
          if [ -n "$PACKAGING_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::PACKAGING_TOKEN is not set: the Homebrew tap and the Scoop bucket were not updated."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.token.outputs.enabled == 'true'
      - uses: actions/checkout@v7
        if: steps.token.outputs.enabled == 'true'
        with:
          repository: BokhodirUrinboev/homebrew-tap
          token: ${{ secrets.PACKAGING_TOKEN }}
          path: homebrew-tap
      - uses: actions/checkout@v7
        if: steps.token.outputs.enabled == 'true'
        with:
          repository: BokhodirUrinboev/scoop-bucket
          token: ${{ secrets.PACKAGING_TOKEN }}
          path: scoop-bucket
      - name: Stamp the cask and the Scoop manifest
        if: steps.token.outputs.enabled == 'true'
        shell: pwsh
        # Downloads the release's macOS zips and Windows installers and hashes them.
        run: ./packaging/Update-PackageManifests.ps1 -Version $env:VERSION -OutDir "$env:RUNNER_TEMP/manifests"
      - name: Push them to the tap and the bucket
        if: steps.token.outputs.enabled == 'true'
        run: |
          publish() { # <clone> <stamped file> <path in the clone>
            cp "$2" "$1/$3"
            if git -C "$1" diff --quiet; then
              echo "$1 already has $VERSION"
              # Still check the token can push, so an expired token shows up before a release needs it.
              git -C "$1" push --dry-run origin HEAD
            else
              git -C "$1" -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -am "Desk Arcade $VERSION"
              git -C "$1" push origin HEAD
            fi
          }
          publish homebrew-tap "$RUNNER_TEMP/manifests/homebrew/deskarcade.rb" Casks/deskarcade.rb
          publish scoop-bucket "$RUNNER_TEMP/manifests/scoop/deskarcade.json" bucket/deskarcade.json

  winget:
    name: winget
    runs-on: windows-latest
    steps:
      # WINGET_TOKEN: a classic token with the public_repo scope (wingetcreate doesn't support fine-grained
      # tokens). New versions only go in once winget-pkgs has the package; the first submission is
      # microsoft/winget-pkgs#437055, and a moderator merges it.
      - name: Check winget-pkgs
        id: check
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          package=manifests/i/ImperiumGames/DeskArcade
          enabled=false
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::warning::WINGET_TOKEN is not set: nothing was submitted to winget."
          elif ! gh api "repos/microsoft/winget-pkgs/contents/$package" --silent 2>/dev/null; then
            echo "::notice::winget-pkgs doesn't have ImperiumGames.DeskArcade yet (microsoft/winget-pkgs#437055): nothing to update."
          elif gh api "repos/microsoft/winget-pkgs/contents/$package/$VERSION" --silent 2>/dev/null; then
            echo "::notice::winget-pkgs already has ImperiumGames.DeskArcade $VERSION."
          elif [ -n "$(gh pr list --repo microsoft/winget-pkgs --state open --search "ImperiumGames.DeskArcade $VERSION in:title" --json number --jq '.[].number')" ]; then
            echo "::notice::A pull request for ImperiumGames.DeskArcade $VERSION is already open in winget-pkgs."
          else
            enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.check.outputs.enabled == 'true'
      - name: Stamp the manifests
        if: steps.check.outputs.enabled == 'true'
        shell: pwsh
        run: ./packaging/winget/Update-WingetManifests.ps1 -Version $env:VERSION -OutDir "dist/winget/$env:VERSION"
      - name: Submit them to winget-pkgs
        if: steps.check.outputs.enabled == 'true'
        shell: pwsh
        env:
          # wingetcreate reads its token from here; a --token argument can end up in the log.
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          WINGETCREATE_URL: https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe
          WINGETCREATE_SHA256: 24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest $env:WINGETCREATE_URL -OutFile $exe
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $env:WINGETCREATE_SHA256) { throw 'wingetcreate.exe does not match its pinned SHA256' }
          & $exe submit --no-open --prtitle "New version: ImperiumGames.DeskArcade version $env:VERSION" "dist/winget/$env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate submit failed ($LASTEXITCODE)" }

  chocolatey:
    name: Chocolatey
    runs-on: windows-latest
    steps:
      # CHOCOLATEY_API_KEY: the API key of the free community.chocolatey.org account that maintains the package. Every
      # version goes through Chocolatey's automatic checks, and the first one also waits for a moderator.
      - name: Check for the API key
        id: key
        shell: bash
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          if [ -n "$CHOCOLATEY_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CHOCOLATEY_API_KEY is not set: nothing was pushed to Chocolatey."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.enabled == 'true'
      - name: Stamp and pack the package
        if: steps.key.outputs.enabled == 'true'
        shell: pwsh
        # Downloads the release's x64 standalone and ARM64 installers, hashes them, and runs choco pack (on the image).
        run: ./packaging/chocolatey/Update-ChocolateyPackage.ps1 -Version $env:VERSION -OutDir "$env:RUNNER_TEMP/chocolatey"
      - name: Install and uninstall it on the runner
        if: steps.key.outputs.enabled == 'true'
        shell: pwsh
        # A clean Windows: the same silent install and uninstall Chocolatey's own test machine will run.
        run: |
          choco install deskarcade --source "$env:RUNNER_TEMP/chocolatey" --version $env:VERSION --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install failed ($LASTEXITCODE)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Desk Arcade\DeskArcade.exe'
          if (-not (Test-Path $exe)) { throw "$exe is missing after choco install" }
          choco uninstall deskarcade --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco uninstall failed ($LASTEXITCODE)" }
          # the Inno Setup uninstaller finishes from a copy of itself in TEMP, so give it a moment
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "$exe is still there after choco uninstall" }
      - name: Push it to the community repository
        if: steps.key.outputs.enabled == 'true'
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $nupkg = Join-Path $env:RUNNER_TEMP "chocolatey/deskarcade.$env:VERSION.nupkg"
          $output = choco push $nupkg --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) {
            # A version that is already there, listed or waiting for moderation, answers 409 Conflict.
            if ($output -match '409|Conflict') { Write-Host "::notice::Chocolatey already has deskarcade $env:VERSION." }
            else { throw "choco push failed ($LASTEXITCODE)" }
          }

  aur:
    name: AUR
    runs-on: ubuntu-24.04
    steps:
      # AUR_SSH_KEY: the private half of an SSH key without a passphrase, made for this alone, whose public half is on
      # the free aur.archlinux.org account that maintains deskarcade-bin.
      - name: Check for the SSH key
        id: key
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -n "$AUR_SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AUR_SSH_KEY is not set: nothing was pushed to the AUR."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.enabled == 'true'
      - name: Stamp the PKGBUILD and .SRCINFO
        if: steps.key.outputs.enabled == 'true'
        shell: pwsh
        # Downloads the release's amd64 and arm64 .debs and hashes them.
        run: ./packaging/aur/Update-AurPackage.ps1 -Version $env:VERSION -OutDir "$env:RUNNER_TEMP/aur"
      - name: Build and install it on Arch Linux
        if: steps.key.outputs.enabled == 'true'
        # makepkg won't run as root, so a user builds the package and pacman installs it. makepkg must also print the
        # stamped .SRCINFO exactly, since the AUR shows and resolves packages from that file.
        run: |
          docker run --rm -v "$RUNNER_TEMP/aur:/pkg:ro" archlinux:latest bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed base-devel sudo > /dev/null
            useradd -m builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
            install -d -o builder /home/builder/pkg
            install -m 644 -o builder /pkg/PKGBUILD /home/builder/pkg/
            cd /home/builder/pkg
            sudo -u builder makepkg --printsrcinfo | diff -u /pkg/.SRCINFO -
            sudo -u builder makepkg --syncdeps --install --noconfirm
            test -x /usr/bin/deskarcade
            deskarcade --signal quit'
      - name: Push it to the AUR
        if: steps.key.outputs.enabled == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          # aur.archlinux.org's Ed25519 host key (SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4, the fingerprint
          # on the AUR's front page), so the key is only ever offered to the AUR.
          AUR_HOST_KEY: aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          printf '%s\n' "$AUR_HOST_KEY" > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          # Cloning a package that doesn't exist yet gives an empty repository, and the first push creates it.
          git clone ssh://aur@aur.archlinux.org/deskarcade-bin.git "$RUNNER_TEMP/aur-repo"
          cp "$RUNNER_TEMP/aur/PKGBUILD" "$RUNNER_TEMP/aur/.SRCINFO" "$RUNNER_TEMP/aur-repo/"
          git -C "$RUNNER_TEMP/aur-repo" add PKGBUILD .SRCINFO
          if git -C "$RUNNER_TEMP/aur-repo" diff --cached --quiet; then
            echo "The AUR already has deskarcade-bin $VERSION"
          else
            git -C "$RUNNER_TEMP/aur-repo" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Desk Arcade $VERSION"
            # the AUR only accepts pushes to master
            git -C "$RUNNER_TEMP/aur-repo" push origin HEAD:master
          fi

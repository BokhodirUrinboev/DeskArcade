# Builds the Windows installers and the Ubuntu package and publishes them as a GitHub Release.
#
# Release a new version:
#   1. Bump <Version> in DeskArcade.csproj (for example 1.2.1 -> 1.3.0) and merge it.
#   2. git tag v1.3.0 && git push origin v1.3.0
# The tag must match the csproj version, so the packages upgrade an existing install correctly.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (for example 1.3.0). Builds only; no release is published.'
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          csproj="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' DeskArcade.csproj | head -n1)"
          if [ "$version" != "$csproj" ]; then
            echo "::error::Tag version $version does not match <Version>$csproj</Version> in DeskArcade.csproj"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ubuntu:
    name: Ubuntu package
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build .deb
        run: packaging/linux/build.sh "${{ needs.version.outputs.version }}"
      - name: Check the package installs
        run: |
          sudo apt-get install -y ./dist-linux/deskarcade_${{ needs.version.outputs.version }}_amd64.deb
          test -x /usr/bin/deskarcade
          dpkg -s deskarcade | grep '^Version: ${{ needs.version.outputs.version }}$'
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu
          path: dist-linux/*.deb
          if-no-files-found: error

  windows:
    name: Windows installers
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build installer (needs .NET runtime)
        shell: pwsh
        run: .\build-installer.ps1 -Version ${{ needs.version.outputs.version }}
      - name: Build standalone installer (runtime bundled)
        shell: pwsh
        run: .\build-installer.ps1 -SelfContained -Version ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: installer/Output/DeskArcade-Setup-*.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push'
    needs: [version, ubuntu, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l packages
          cat > notes.md <<EOF_NOTES
          | Platform | Download |
          |---|---|
          | Windows 10/11 (x64), needs the [.NET 10 Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) | \`DeskArcade-Setup-$VERSION.exe\` |
          | Windows 10/11 (x64), runtime bundled | \`DeskArcade-Setup-$VERSION-standalone.exe\` |
          | Ubuntu 22.04 / 24.04 (x64) | \`deskarcade_${VERSION}_amd64.deb\` — \`sudo apt install ./deskarcade_${VERSION}_amd64.deb\` |

          Both packages upgrade an existing install in place; settings and high scores are kept.
          EOF_NOTES
          gh release create "$GITHUB_REF_NAME" packages/* \
            --title "Desk Arcade $VERSION" \
            --notes-file notes.md \
            --generate-notes

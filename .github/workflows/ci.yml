# Builds Desk Arcade on Windows, Ubuntu and macOS for pull requests and pushes to main, packages and
# install-checks the Ubuntu .deb, and lints the workflows. Publishing releases is release.yml's job.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels that PR's older run. Pushes to main and manual runs get a
  # group of their own, so they always run to completion.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    name: Windows build (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build DeskArcade.csproj -c Release -r win-x64

  ubuntu:
    name: Ubuntu build and .deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build DeskArcade.csproj -c Release -r linux-x64

      - name: Test
        run: dotnet test tests/DeskArcade.Tests/DeskArcade.Tests.csproj -c Release

      - name: Package .deb
        run: bash packaging/linux/build.sh
      - name: Check the package installs
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' DeskArcade.csproj | head -n1)"
          sudo apt-get update # the runner image's package lists go stale; dependencies then 404
          sudo apt-get install -y "./dist-linux/deskarcade_${version}_amd64.deb"
          test -x /usr/bin/deskarcade
          dpkg -s deskarcade | grep -Fx "Version: $version"

  macos:
    name: macOS build (osx-arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Compile only: the macOS platform layer is still being written.
      - name: Build
        run: dotnet build DeskArcade.csproj -c Release -r osx-arm64

  smoke:
    # Start the real app on ARM64 and Apple Silicon hardware, which no other job does: publish, run it in
    # demo mode, open the stats window and quit it over --signal. See tests/smoke.sh.
    name: Smoke test (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-11-arm, rid: win-arm64, exe: DeskArcade.exe }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, exe: DeskArcade }
          - { os: macos-14, rid: osx-arm64, exe: DeskArcade }
    env:
      RID: ${{ matrix.rid }}
      EXE: out/${{ matrix.exe }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        shell: bash
        run: dotnet publish DeskArcade.csproj -c Release -r "$RID" --self-contained -o out
      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb dbus libfontconfig1 libice6 libsm6
      - name: Run it
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run -a bash tests/smoke.sh "$EXE"
          else
            bash tests/smoke.sh "$EXE"
          fi

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image bundles shellcheck, so run: scripts are checked too.
      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
